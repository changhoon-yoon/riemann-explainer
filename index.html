<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리만가설, 뭐가 풀린 걸까? · 중학생용 애니메이션</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --cell:#f0efec;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --goodtext:#006300; --warn:#fab219; --crit:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --cell:#2c2c2a;
    --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926;
    --good:#0ca30c; --goodtext:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
.app{max-width:980px;margin:0 auto;padding:20px 16px 28px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.step{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
.stage{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
#svg{display:block;width:100%;height:auto}
#html{display:none;padding:28px 30px}
.stage.html-mode #svg{display:none}
.stage.html-mode #html{display:block}
.captions{min-height:205px;margin:14px 2px 8px;font-size:17px}
.cap{margin:0 0 6px;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s,color .45s}
.cap.in{opacity:1;transform:none}
.cap.old{color:var(--ink2)}
nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:15px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
  border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{background:var(--cell)}
button.primary{background:var(--s1);border-color:var(--s1);color:#fff}
button.primary:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default}
button.on{border-color:var(--s1);color:var(--s1)}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:5px;background:var(--axis);border:none;padding:0;transition:width .25s}
.dot:hover{background:var(--muted)}
.dot.on{background:var(--s1);width:24px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);
  box-shadow:0 4px 16px rgba(0,0,0,.14);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.55;
  opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;left:0;top:0}
.tip.show{opacity:1}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
footer{margin-top:16px;font-size:12px;color:var(--muted)}

/* svg */
#svg *{pointer-events:none}
#svg .hit{pointer-events:all;cursor:crosshair}
#svg text{font-family:inherit}
.tick{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.lbl{font-size:14px;fill:var(--ink2)}
.lbl-ink{font-size:14px;fill:var(--ink)}
.lbl-b{font-size:15px;fill:var(--ink);font-weight:700}
.big{font-size:26px;fill:var(--ink);font-weight:800}
.formula{font-size:20px;fill:var(--ink);font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.axis-strong{stroke:var(--muted);stroke-width:1.2}
.xhair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.xmark{stroke:var(--surface);stroke-width:2}
.line-s1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round}
.line-s2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round}
.fill-s1{fill:var(--s1)} .fill-s2{fill:var(--s2)}
.dot-s1{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.dot-muted{fill:var(--muted);stroke:var(--surface);stroke-width:2}
.dot-crit{fill:var(--crit);stroke:var(--surface);stroke-width:2}
.cellbg{fill:var(--cell);transition:fill .3s}
.celltext{font-size:20px;fill:var(--ink);font-weight:600;transition:fill .3s}
.cell.prime .cellbg{fill:var(--s1)}
.cell.prime .celltext{fill:#fff}
.cell.gone .cellbg{fill:var(--surface)}
.cell.gone .celltext{fill:var(--muted);font-weight:400}
.strike{stroke:var(--muted);stroke-width:1.5}
.ring{fill:none;stroke:var(--s2);stroke-width:3}
.bracket{fill:none;stroke:var(--s2);stroke-width:2}
.target{stroke:var(--ink2);stroke-width:1.5;stroke-dasharray:5 4}
.critline{stroke:var(--s1);stroke-width:2;stroke-dasharray:7 5}
.strip{fill:var(--s1);opacity:.10}
.panel{fill:var(--surface);stroke:var(--border);stroke-width:1}
.panel-soft{fill:var(--cell)}
.codebar{fill:var(--axis)}
.check{fill:var(--good);font-weight:800;font-size:15px}
.goodtext{fill:var(--goodtext);font-weight:700}
.crittext{fill:var(--crit);font-weight:800}

/* html scenes */
.cover{display:flex;gap:24px;align-items:center;min-height:384px}
.cover-text{flex:1}
.kicker{font-size:13px;color:var(--muted);margin-bottom:6px}
.cover h2{font-size:38px;line-height:1.25;margin:0 0 14px;letter-spacing:-.02em}
.cover p{font-size:17px;color:var(--ink2);margin:0 0 18px;max-width:520px}
.cover .hint{font-size:13px;color:var(--muted);margin-top:14px}
.cover-art{width:200px;height:320px;flex:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:1px solid var(--border);border-top-width:4px;border-radius:12px;padding:14px 16px;background:var(--surface);
  opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.card.in{opacity:1;transform:none}
.card h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.card ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--ink2)}
.card li{margin-bottom:7px}
.card li b{color:var(--ink)}
.card.good{border-top-color:var(--good)}
.card.wait{border-top-color:var(--warn)}
.card.bad{border-top-color:var(--crit)}
.ico{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:14px;font-weight:800}
.good .ico{background:var(--good)} .wait .ico{background:var(--warn);color:#0b0b0b} .bad .ico{background:var(--crit)}
.oneliner{margin:18px 0 0;padding:14px 18px;border-radius:12px;background:var(--cell);font-size:17px;
  opacity:0;transition:opacity .6s}
.oneliner.in{opacity:1}
.sources{margin-top:16px;font-size:12.5px;color:var(--muted)}
.sources a{color:var(--s1)}
@media (max-width:760px){
  .cards{grid-template-columns:1fr}
  .cover{flex-direction:column;align-items:flex-start}
  .cover-art{display:none}
  .cover h2{font-size:30px}
  .captions{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <header><span class="step" id="step"></span><h1 id="title"></h1></header>
  <section class="stage" id="stage">
    <svg id="svg" viewBox="0 0 900 440" role="img" aria-label="애니메이션 그림"></svg>
    <div id="html"></div>
    <div class="tip" id="tip"></div>
  </section>
  <section class="captions" id="captions" aria-live="polite"></section>
  <nav>
    <button id="prev">← 이전</button>
    <button id="replay" title="이 단계 다시 보기">↻ 다시 보기</button>
    <div class="dots" id="dots"></div>
    <button id="auto" title="단계가 끝나면 자동으로 다음으로">▶ 자동 재생</button>
    <button id="next" class="primary">다음 →</button>
  </nav>
  <footer>2026년 11월 22일 기준 · 보도와 원문(알푀게의 노트, Lean 커뮤니티 발표)을 바탕으로 만든 설명 자료예요. 그래프의 영점·제타 값은 mpmath로 직접 계산한 실제 값이에요.</footer>
</div>

/* 1. 소수 */
async function scenePrimes() {
  const cols = 10, cw = 80, ch = 60, ox = (900 - cols * cw) / 2, oy = 42;
  const cells = {};
  for (let n = 1; n <= 60; n++) {
    const i = n - 1, x = ox + (i % cols) * cw, y = oy + Math.floor(i / cols) * ch;
    const g = el('g', { class: 'cell', transform: `translate(${x},${y})` });
    el('rect', { x: 4, y: 4, width: cw - 8, height: ch - 8, rx: 9, class: 'cellbg' }, g);
    el('text', { x: cw / 2, y: ch / 2 + 7, 'text-anchor': 'middle', class: 'celltext', text: n }, g);
    const strike = el('line', { x1: 18, y1: ch - 16, x2: cw - 18, y2: 16, class: 'strike' }, g); hide(strike);
    hide(g); cells[n] = { g, strike, gone: false };
  }
  await say('<b>소수</b>는 1과 자기 자신으로만 나누어떨어지는 수예요. 1부터 60까지 늘어놓고 찾아볼게요.');
  await tween(1100, p => { for (let n = 1; n <= 60; n++) cells[n].g.style.opacity = clamp((p * 70 - n) / 10, 0, 1); }, ease.lin);
  await wait(300);
  cells[1].g.classList.add('gone'); cells[1].gone = true;
  await say('1은 소수가 아니라서 빼요. 그다음 <b>2</b>는 소수! 2의 배수(4, 6, 8, …)는 2로 나누어지니까 지워요.');
  for (const p of [2, 3, 5, 7]) {
    cells[p].g.classList.add('prime');
    await wait(350);
    for (let m = 2 * p; m <= 60; m += p) {
      if (cells[m].gone) continue;
      cells[m].gone = true; cells[m].g.classList.add('gone'); cells[m].strike.style.opacity = 1;
      await wait(p === 2 ? 45 : 70);
    }
    await wait(350);
    if (p === 2) await say('3, 5, 7도 똑같이 해요. 소수를 찾을 때마다 그 배수를 지워요. (이 방법을 <b>에라토스테네스의 체</b>라고 해요)');
  }
  await wait(200);
  for (let n = 2; n <= 60; n++) if (!cells[n].gone && !cells[n].g.classList.contains('prime')) { cells[n].g.classList.add('prime'); await wait(70); }
  await say('남은 수가 전부 소수예요: 2, 3, 5, 7, 11, 13, 17, … 60까지 <b>17개</b>.');
  await wait(500);
  const rings = [12, 60].map(n => {
    const i = n - 1, x = ox + (i % cols) * cw, y = oy + Math.floor(i / cols) * ch;
    return hide(el('rect', { x: x + 1, y: y + 1, width: cw - 2, height: ch - 2, rx: 11, class: 'ring' }));
  });
  rings.forEach(r => fadeIn(r).catch(() => {}));
  await say('모든 자연수는 소수의 곱으로 만들 수 있어요. 12 = 2×2×3, 60 = 2×2×3×5. 그래서 소수를 <b>‘수의 원자’</b>라고 불러요.');
}

  el('text', { x: xs(target), y: 98, 'text-anchor': 'middle', class: 'lbl-ink', text: '1.6449… (= π²/6)' }, tg);

  const row = (y, label) => {
    el('text', { x: X0 - 12, y: y + 23, 'text-anchor': 'end', class: 'lbl-ink', text: label });
    const bar = el('rect', { x: X0, y, width: 0, height: 36, rx: 4 });

    return { bar, val, f };
  };
  const A1 = row(150, '모든 자연수로 더하기'); A1.bar.setAttribute('class', 'fill-s1');
  const A2 = row(290, '소수만으로 곱하기'); A2.bar.setAttribute('class', 'fill-s2');
  const setBar = (R, v, label) => { R.bar.setAttribute('width', Math.max(0, xs(v) - X0)); R.val.setAttribute('x', xs(v) + 8); R.val.textContent = label; };

  const S = [0]; for (let n = 1; n <= 1000; n++) S.push(S[n - 1] + 1 / (n * n));
  const P = [1]; PRIMES.forEach((p, i) => P.push(P[i] * (p * p) / (p * p - 1)));

  await say('리만이 쓴 도구는 <b>제타 함수</b>예요. 먼저 쉬운 예: 1, 2, 3, 4, … 의 <b>제곱분의 1</b>을 끝없이 더해 볼게요.');
  const sumTerms = ['1', '1/2²', '1/3²', '1/4²', '1/5²', '1/6²', '1/7²', '1/8²'];
  for (let n = 1; n <= 8; n++) {
    A1.f.textContent = sumTerms.slice(0, n).join(' + ') + ' + …';
    const a = S[n - 1], b = S[n];
    await tween(420, p => setBar(A1, a + (b - a) * p, (a + (b - a) * p).toFixed(4)));
    await wait(120);
  }
  await tween(1800, p => { const n = Math.max(8, Math.round(8 + 992 * p)); setBar(A1, S[n], `${S[n].toFixed(4)}  (${fmt(n)}개 더함)`); }, ease.out);
  await fadeIn(tg);
  await say('더할수록 <b>1.6449…</b>라는 수에 다가가요. 신기하게도 원주율 π가 튀어나와요(π²/6).');
  await wait(500);
  await say('이번엔 <b>소수만</b> 써서 곱해 볼게요. 소수 p마다 p²/(p²−1)을 곱해요: 4/3 × 9/8 × 25/24 × 49/48 × …');
  const prodTerms = ['4/3', '9/8', '25/24', '49/48', '121/120', '169/168'];
  for (let k = 1; k <= 6; k++) {
    A2.f.textContent = prodTerms.slice(0, k).join(' × ') + ' × …';
    const a = P[k - 1], b = P[k];
    await tween(420, p => setBar(A2, a + (b - a) * p, (a + (b - a) * p).toFixed(4)));
    await wait(120);
  }
  await tween(1800, p => { const k = Math.max(6, Math.round(6 + (PRIMES.length - 6) * p)); setBar(A2, P[k], `${P[k].toFixed(4)}  (소수 ${k}개)`); }, ease.out);
  await say('<b>똑같은 수</b>에 도착해요! 모든 자연수로 만든 합 = 소수만으로 만든 곱(오일러의 발견). 그래서 제타 함수 안에는 <b>소수 정보가 통째로</b> 들어 있어요.');
  await wait(600);
  await say('리만(1859)은 여기서 ‘2’ 자리에 다른 수, 심지어 <b>지도 위의 점</b>까지 넣어서 제타 함수를 커다란 지도처럼 펼쳤어요.');
}

/* 8. 영점 = 소수의 음표 */
async function sceneWaves() {
  const A = { L: 80, R: 860, T: 48, B: 372 };
  const xs = lin(0, 40, A.L, A.R), ys = lin(-2, 44, A.B, A.T);
  drawAxes(A, xs, ys, { xt: [0, 5, 10, 15, 20, 25, 30, 35, 40], yt: [0, 10, 20, 30, 40], xl: 'x →', yl: '소수 계단' });
  // 실제 계단 ψ(x)
  const steps = []; for (let n = 2; n <= 40; n++) { for (const p of PRIMES) { if (p > n) break; let q = p; while (q < n) q *= p; if (q === n) { steps.push([n, Math.log(p)]); break; } } }
  const psiAt = x => steps.reduce((s, [n, l]) => s + (n <= x ? l : 0), 0);
  let d = `M${xs(1.5)},${ys(0)}`, acc = 0;
  steps.forEach(([n, l]) => { acc += l; d += `H${xs(n).toFixed(1)}V${ys(acc).toFixed(1)}`; }); d += `H${xs(40)}`;
  const XS = []; for (let x = 1.5; x <= 40.0001; x += 0.02) XS.push(x);
  function approx(x, N) {
    let s = x - Math.log(2 * Math.PI) - 0.5 * Math.log(1 - 1 / (x * x));
    const lx = Math.log(x), sx = Math.sqrt(x);
    for (let k = 0; k < N; k++) { const g = ZEROS[k]; s -= sx * (Math.cos(g * lx) + 2 * g * Math.sin(g * lx)) / (0.25 + g * g); }
    return s;
  }
  const Ns = [0, 1, 2, 5, 10, 30, 100];
  const curves = {}; Ns.forEach(N => curves[N] = XS.map(x => approx(x, N)));
  const cr = clipRect('clipW', A.L, A.T - 4, A.R - A.L, A.B - A.T + 4);
  const stair = hide(el('path', { d, class: 'line-s1' }));
  const wave = hide(el('path', { d: '', class: 'line-s2', 'clip-path': 'url(#clipW)' }));
  let curN = 0, curArr = curves[0];
  const draw = arr => wave.setAttribute('d', pathOf(XS.map((x, i) => [xs(x), ys(arr[i])])));
  const nLabel = hide(el('text', { x: A.L + 14, y: A.T + 26, class: 'big', text: '사용한 영점: 0개' }));
  const lg = hide(legend(A.L + 16, A.T + 56, [['실제 소수 계단', 'var(--s1)', 'line'], ['영점 파동들의 합', 'var(--s2)', 'line']]));
  const xh = crosshair(A, xs, xv => {
    if (xv < 1.5 || xv > 40) return null; const x = Math.round(xv * 10) / 10; const a = psiAt(x), b = approx(x, curN);
    return { x, pts: [[xs(x), ys(a), 'var(--s1)'], [xs(x), ys(clamp(b, -2, 44)), 'var(--s2)']],
      html: `x = <b>${x.toFixed(1)}</b><br><span class="sw" style="background:var(--s1)"></span>실제 계단: <b>${a.toFixed(2)}</b><br><span class="sw" style="background:var(--s2)"></span>영점 ${curN}개로 만든 값: <b>${b.toFixed(2)}</b>` };
  });
  await say('리만은 놀라운 공식을 찾았어요: <b>영점 하나하나가 ‘파동(음)’ 하나</b>가 되고, 그 파동을 모두 더하면 소수 계단이 그대로 만들어져요.');
  await fadeIn(stair, 500); fadeIn(lg).catch(() => {});
  await wait(300);
  draw(curArr); await fadeIn(wave, 400); await fadeIn(nLabel, 300);
  await say('영점을 0개 → 1개 → 10개 → 100개 쓸수록, 파동의 합이 계단에 <b>착 달라붙어요</b>.');
  for (const N of Ns.slice(1)) {
    const from = curArr, to = curves[N];
    nLabel.textContent = `사용한 영점: ${N}개`;
    await tween(1000, p => draw(from.map((v, i) => v + (to[i] - v) * p)));
    curArr = to; curN = N;
    await wait(650);
  }
  await say('영점이 모두 1/2 선 위에 있으면 파동들의 크기가 <b>딱 적당히 작게</b> 유지돼요 → 소수 개수 예측의 오차가 가장 작은 범위로 묶여요.');
  await wait(500);
  await say('그래서 수천 개의 수학 정리가 <b>“리만가설이 맞다면…”</b>으로 시작해요. <span style="color:var(--muted);font-size:14px">(※ 이 계단은 소수와 4, 8, 9 같은 소수의 거듭제곱에서 올라가고, 칸 높이가 수마다 조금씩 달라요)</span>');
  svg.appendChild(xh);
}

const DARK = matchMedia('(prefers-color-scheme: dark)').matches;
function heatImage() {
  const H = HEAT, bytes = Uint8Array.from(atob(H.b64), c => c.charCodeAt(0));
  const stops = DARK
    ? [[0, '#1a1a19'], [.15, '#104281'], [.38, '#1c5cab'], [.62, '#3987e5'], [.85, '#86b6ef'], [1, '#cde2fb']]
    : [[0, '#fcfcfb'], [.12, '#cde2fb'], [.35, '#86b6ef'], [.58, '#3987e5'], [.8, '#1c5cab'], [1, '#0d366b']];
  const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const lut = [];
  for (let q = 0; q < 256; q++) {
    const lv = H.lo + q / 255 * (H.hi - H.lo), v = clamp((lv + 1.3) / 2.0, 0, 1); let k = 0; /* 표시 범위: |ζ| 0.05 ~ 5 */ while (k < stops.length - 2 && v > stops[k + 1][0]) k++;
    const [a, ca] = stops[k], [b, cb] = stops[k + 1], f = (v - a) / (b - a);
    const A = rgb(ca), B = rgb(cb); lut.push(A.map((x, i) => Math.round(x + (B[i] - x) * f)));
  }
  const cv = document.createElement('canvas'); cv.width = H.ns; cv.height = H.nt;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(H.ns, H.nt);
  for (let j = 0; j < H.nt; j++) for (let i = 0; i < H.ns; i++) {
    const q = bytes[j * H.ns + i], o = ((H.nt - 1 - j) * H.ns + i) * 4, c = lut[q];
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const zetaAbs = (s, t) => {
    const i = clamp(Math.round((s - H.s0) / (H.s1 - H.s0) * (H.ns - 1)), 0, H.ns - 1);
    const j = clamp(Math.round((t - H.t0) / (H.t1 - H.t0) * (H.nt - 1)), 0, H.nt - 1);
    return Math.pow(10, H.lo + bytes[j * H.ns + i] / 255 * (H.hi - H.lo));
  };
  return { url: cv.toDataURL(), zetaAbs };
}

  await say('영점의 <b>가로 좌표</b>에는 진짜 의미가 있어요. 그 영점이 만드는 파동이 <b>얼마나 빨리 커지는지</b>를 정해요. 가로가 a인 영점의 파동은 대략 <b>x의 a제곱</b>만큼 커져요.');
  fadeIn(lg).catch(() => {});
  await tween(2200, p => c1.setAttribute('width', p * (A.R - A.L + 4)), ease.io);
  await fadeIn(l1, 300);
  await say('가로 1/2 → 파동 크기는 대략 <b>√x</b>. x가 1만이면 약 <b>100</b>이에요.');
  await wait(400);
  await tween(2200, p => c2.setAttribute('width', p * (A.R - A.L + 4)), ease.io);
  await fadeIn(l2, 300);
  await say('만약 가로 0.8인 영점이 <b>하나라도</b> 있다면 → 대략 x<sup>0.8</sup>. x가 1만이면 약 <b>1,585</b>로 훨씬 커요. 소수 개수 예측의 오차도 그만큼 커져요.');
  await wait(500);
  await fadeIn(gD, 500);
  await say('그런데 영점은 1/2을 기준으로 <b>거울 짝</b>으로 나와요(0.8이 있으면 0.2도 있어요). 짝 중 큰 쪽이 오차를 키우니까, <b>전부 정확히 1/2 위에 있을 때가 오차가 가장 작은 경우</b>예요.');
  await wait(500);
  await say('그래서 “영점이 전부 1/2 위에 있다” = “소수 개수 예측의 오차가 가능한 한 가장 작다”. <b>같은 말</b>이에요.');
  svg.appendChild(xh);
}

/* ---------- scene runner ---------- */
const SCENES = [
  { t: '리만가설, 도대체 뭐가 풀린 걸까?', f: sceneCover, html: true },
  { t: '① 소수: 수의 원자', f: scenePrimes },
  { t: '② 소수는 제멋대로 나타나요', f: sceneScatter },
  { t: '③ 그래도 ‘개수’는 예측할 수 있어요', f: sceneCount },
  { t: '④ 리만의 도구: 제타 함수', f: sceneZeta },
  { t: '⑤ 지도 위의 ‘0이 되는 점’ (영점)', f: scenePlane },
  { t: '⑥ ‘영점이 1/2 위에 있다’는 게 무슨 뜻?', f: sceneMeaning },
  { t: '⑦ 1/2 선을 따라 걸으며 영점 찾기', f: sceneWalk },
  { t: '⑧ 리만가설: 영점은 전부 한 줄 위에?', f: sceneRH },
  { t: '⑨ 왜 중요할까? 영점은 소수의 ‘음표’', f: sceneWaves },
  { t: '⑩ 왜 하필 1/2일까?', f: sceneWhyHalf },
  { t: '⑪ 167년 동안의 진도표', f: sceneProgress },
  { t: '⑫ 이번엔 ‘채점 로봇’이 검사했어요', f: sceneLean },
  { t: '⑬ 그래서 정확히 뭐가 풀렸나?', f: sceneSummary, html: true },
];
let cur = 0, auto = false;
const dotsBox = document.getElementById('dots');
SCENES.forEach((s, i) => { const b = document.createElement('button'); b.className = 'dot'; b.title = s.t; b.setAttribute('aria-label', s.t); b.onclick = () => go(i); dotsBox.appendChild(b); });
const prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next'), autoBtn = document.getElementById('auto');
async function go(i) {
  if (i < 0 || i >= SCENES.length) return;
  token++; cur = i; hideTip();
  const s = SCENES[i];
  svg.innerHTML = ''; htmlLayer.innerHTML = ''; caps.innerHTML = '';
  stage.classList.toggle('html-mode', !!s.html);
  document.getElementById('title').textContent = s.t;
  document.getElementById('step').textContent = i === 0 ? '표지' : `${i} / ${SCENES.length - 1}`;
  [...dotsBox.children].forEach((d, k) => d.classList.toggle('on', k === i));
  prevBtn.disabled = i === 0; nextBtn.disabled = i === SCENES.length - 1;
  try {
    await s.f();
    if (auto && cur < SCENES.length - 1) { await wait(3200); go(cur + 1); }
  } catch (e) { if (e !== CANCEL) console.error(e); }
}
prevBtn.onclick = () => go(cur - 1);
nextBtn.onclick = () => go(cur + 1);
document.getElementById('replay').onclick = () => go(cur);
autoBtn.onclick = () => {
  auto = !auto; autoBtn.classList.toggle('on', auto); autoBtn.textContent = auto ? '⏸ 자동 재생 중' : '▶ 자동 재생';
  if (auto) go(cur);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(cur + 1);
  else if (e.key === 'ArrowLeft') go(cur - 1);
});
go(+(location.hash.slice(1)) || 0);
</script>
